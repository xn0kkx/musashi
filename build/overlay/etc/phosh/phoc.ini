# phoc (wlroots compositor) output config for the virtio-gpu framebuffer
# QEMU exposes as "Virtual-1". Fills the full 1920x1080 host screen (see
# run.sh: -device virtio-vga,xres=1920,yres=1080 + video=Virtual-1:1920x1080)
# while keeping touch targets Android-sized for gesture-driven input, which
# is inherently less precise than a real finger on real glass.
#
# If the output name doesn't match what phoc actually enumerates (check with
# `wlr-randr` inside the guest, or journalctl for phoc's startup log), this
# section is silently ignored and phoc falls back to its default mode.
#
# xwayland=true: needed for musashi_gestures' cv2.imshow debug preview
# (overlay.py). Requires the `xwayland` apt package installed in the guest
# (see chroot-setup.sh) — otherwise phoc just skips X11 support silently.
[core]
xwayland = true

[output:Virtual-1]
mode = 1920x1080
scale = 2
