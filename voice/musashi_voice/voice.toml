# musashi-voice defaults, tuned for running on the HOST against the VM.
#
# Overridden section-by-section by /etc/musashi/voice.toml, then by
# ~/.config/musashi/voice.toml, then key-by-key by environment variables named
# MUSASHI_VOICE_<SECTION>_<KEY> (e.g. MUSASHI_VOICE_STT_MODEL=medium,
# MUSASHI_VOICE_VSOCK_CID=4).
#
# The same package now also runs INSIDE the guest, where /etc/musashi/voice.toml
# (shipped by build/overlay) flips the transport to a local unix socket and the
# STT model to a CPU-sized one. Nothing here is guest-specific, so a host
# checkout behaves exactly as it always did.

[vsock]
# The guest CID set by run.sh (-device vhost-vsock-pci,guest-cid=3) and the
# port musashi-effector listens on (effector.toml [server].vsock_port).
cid = 3
port = 5000
timeout_s = 5.0
# When non-empty this wins over cid/port: connect to the effector's local unix
# socket instead of crossing the VM boundary. Empty on the host; set to
# /run/musashi/effector.sock by the guest's /etc/musashi/voice.toml.
unix_path = ""

[audio]
samplerate = 16000          # what Whisper and Silero both want; do not change
channels = 1
blocksize = 512
input_device = ""           # "" = system default; else a sounddevice name/index
max_seconds = 30.0          # hard stop, so a stuck PTT cannot record forever

[vad]
# Silero VAD only trims silence off the ends here — with push-to-talk the end
# of turn is decided by the human, not by the VAD.
enabled = true
threshold = 0.5
pad_ms = 150                # keep this much audio around detected speech

[stt]
model = "large-v3-turbo"    # any faster-whisper name or a local model dir
device = "auto"             # auto | cuda | cpu
compute_type = "auto"       # auto -> int8_float16 on cuda, int8 on cpu
language = "pt"             # pt | en | auto
beam_size = 1               # greedy; latency budget is 900 ms end to end
vad_filter = true

[intent]
# rapidfuzz score (0-100) a phrase must reach to be accepted. Below this it is
# a MISS: logged, spoken back as "não entendi", and — later — handed to the
# local LLM through the resolve_intent() fallback seam.
# 75 sits in the measured gap between the worst real command (85.0) and the
# best unrelated sentence (62.1); see Grammar.match()'s docstring.
min_score = 75.0
locales = ["pt", "en"]

[tts]
enabled = true
# Which synthesis engine speaks. "piper" (default) is the small, fast, canned-
# confirmation voice baked into the guest. "kokoro" is the natural,
# sentence-streaming voice the host uses for the LLM assistant's prose — it
# needs the [llm] extra (pip install 'voice/[llm]') and espeak-ng on the system.
engine = "piper"
# Absolute path to a Piper voice, e.g.
#   ~/.local/share/piper/pt_BR-faber-medium.onnx
# The matching .onnx.json must sit next to it. See voice/README.md for where
# to download it; nothing is fetched automatically. (engine = "piper" only.)
model = ""
locale = "pt"
# Kokoro settings (engine = "kokoro" only), backed by kokoro-onnx. pf_dora is a
# Brazilian female voice; pm_alex / pm_santa are male. lang is an espeak code.
# The two model files are downloaded separately (see docs/host-dev/voice.toml).
kokoro_voice = "pf_dora"
kokoro_lang = "pt-br"
kokoro_speed = 1.0
kokoro_model = "/opt/musashi/kokoro/kokoro-v1.0.onnx"
kokoro_voices = "/opt/musashi/kokoro/voices-v1.0.bin"

[llm]
# The local uncensored assistant reached on a grammar miss. OFF by default so
# the guest and a bare host checkout behave exactly as before; the host test
# profile (~/.config/musashi/voice.toml) sets enabled = true. Needs Ollama
# running the model below. think = false drops the reasoning block for voice
# latency; keep_alive keeps the MoE resident between turns.
enabled = false
base_url = "http://127.0.0.1:11434"
# 8b is the sweet spot on a 4GB GPU: mostly GPU-resident, ~6s/turn warm, and
# reliable at tool use with the fixes here (cwd grounding, text tool-call
# rescue). 30b-a3b is more capable but mostly CPU here (~13-45s). 4b is fastest
# but flaky on multi-step tool use.
model = "huihui_ai/qwen3-abliterated:8b"
keep_alive = "30m"
num_ctx = 8192
think = false
max_turns = 6
# Low, because this agent's main job is running the right command — determinism
# beats variety. Raise toward 0.7 for chattier, less predictable replies.
temperature = 0.2
timeout_s = 120.0
# Spoken the instant the assistant takes over a grammar miss, so a slow first
# turn is not dead silence. Empty ("") disables it. Kept very short.
ack = "só um segundo"
# HOOK(guard-rails S7-S10): the persona / refusal policy is just this string
# today, deliberately minimal. Real guard-rails are a later layer and do not
# change this architecture.
system_prompt = "Você é Musashi, um assistente de voz direto em português do Brasil. Você controla este computador e tem acesso total ao terminal pela ferramenta shell_exec e à internet por web_search e web_fetch. Sempre que uma pergunta puder ser respondida rodando um comando (versão do kernel, usuário atual, arquivos, processos, data), USE o shell_exec em vez de dizer que não consegue. Depois de obter o resultado, responda de forma curta e natural, como numa conversa falada."

[web]
# web.search / web.fetch — QUERY (no side effects), so they run in-process, not
# through the effector. Needs the [llm] extra (ddgs, requests, trafilatura).
enabled = true
max_results = 5
fetch_max_chars = 4000
timeout_s = 10.0

[wake]
# Only `python -m musashi_voice --wake` (what musashi-voice.service runs)
# reads this section — the PTT default mode ignores it entirely. [vad] above
# is a different thing: it trims silence off a PTT recording after a human
# already decided the turn boundary; this section decides the turn boundary
# itself, with no human involved.
word = "musashi"
# rapidfuzz.fuzz.ratio(candidate, word), 0-100. 75 sits in the gap between
# the worst phonetic hit measured ("musaxi", 76.9) and the closest false
# friend measured ("mustache", 66.7) — see wakeword.py's docstring for the
# full corpus and why this is fuzz.ratio rather than the WRatio grammar.py
# uses for the command grammar.
threshold = 75.0
# Silero's per-block P(speech), 0-1. Same scale and same default as
# [vad].threshold above, but a separate knob: tightening the PTT trim must
# never accidentally tighten (or loosen) when the always-on loop opens an
# utterance, and vice versa.
vad_threshold = 0.5
# Continuous silence, in ms, that closes an utterance and hands it to
# Whisper. 700 is a middle point: much below ~600 cuts off a person who
# pauses mid-sentence ("musashi... abrir o terminal"); much above ~800 the
# extra wait is audible in every single interaction's WALL latency (see
# latency.py) for no benefit. This number is the biggest single knob on
# perceived responsiveness in --wake mode.
silence_ms = 700
# An utterance with less estimated speech than this, in ms, is dropped
# before it ever reaches Whisper — a door latch or a cough is not worth a
# CPU-bound transcription.
min_speech_ms = 250
# Audio kept from BEFORE the VAD crosses vad_threshold, in ms. Not optional:
# Silero's probability lags the true start of speech by a block or two, and
# for a short word like "musashi" that lag is exactly the "mu" — without a
# pre-roll the wake word would routinely fail to match its own first
# syllable.
preroll_ms = 300
# After every spoken reply, how long (ms) of audio to discard before
# listening again. This is what stops the loop from hearing its own TTS
# confirmation and treating it as a new utterance. It is a mitigation, not a
# fix: true barge-in and acoustic echo cancellation are out of scope here
# and belong to the Plano Diretor's S3 streaming work.
resume_delay_ms = 250
